# OpenCode V2 global response-gadget configuration.
#
# This file is authoritative only for gadget identity and probability. The
# mode-router plugin bridge is the sole runtime enablement authority. Use
# /gadget to inspect or atomically update probabilities without restarting.

version: 1
primary_agent: osho

gadgets:
  - name: random-srs
    skill: 97-gadget-random-srs
    probability: 0.15

  - name: random-news
    skill: 97-gadget-random-news
    probability: 0.05

  - name: random-fun-facts
    skill: 97-gadget-random-fun-facts
    probability: 0.05
